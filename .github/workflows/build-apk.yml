name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy web files to www
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.png jsmediatags.min.js lame.min.js browser-id3-writer.min.js www/

      - name: Add Android project
        run: npx cap add android

      - name: Add audio permissions
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Add ringtone plugin
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java)
          D=$(dirname $F)
          PKG=$(grep -m1 '^package' $F)
          { echo "$PKG"; tail -n +2 RingtonePlugin.java; } > $D/RingtonePlugin.java
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.WRITE_SETTINGS"/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Ask media permissions at launch
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(grep -m1 '^package' $F)
          cat > $F <<EOF
          $PKG
          import android.Manifest;
          import android.os.Build;
          import android.os.Bundle;
          import android.graphics.Color;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(RingtonePlugin.class);
              super.onCreate(savedInstanceState);
              getWindow().setStatusBarColor(Color.parseColor("#1c1d21"));
              getWindow().setNavigationBarColor(Color.parseColor("#1c1d21"));
              getWindow().getDecorView().setSystemUiVisibility(0);
              if (Build.VERSION.SDK_INT >= 33) {
                requestPermissions(new String[]{Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_MEDIA_IMAGES}, 1);
              } else {
                requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 1);
              }
            }
          }
          EOF

      - name: Set app icon
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            N=${d%%:*}; S=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon.png -resize ${S}x${S} $R/mipmap-$N/$f.png
            done
          done

      - name: Dark splash screen
        run: |
          R=android/app/src/main/res
          S=$R/values/styles.xml
          find $R -name 'splash.png' -delete
          mkdir -p $R/drawable-nodpi
          convert icon.png -alpha set -fuzz 20% -fill none -draw 'color 0,0 floodfill' -resize 240x240 -background none -gravity center -extent 512x512 $R/drawable-nodpi/splash_logo.png
          cat > $R/drawable/splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@android:color/transparent"/>
            <item android:drawable="@drawable/splash_bg"/>
            <item android:width="288dp" android:height="288dp" android:gravity="center" android:drawable="@drawable/splash_logo"/>
          </layer-list>
          XML
          cat > $R/drawable/splash_bg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#1c1d21"/>
          </shape>
          XML
          sed -i 's|<style name="AppTheme.NoActionBarLaunch"[^>]*>|&\n<item name="windowSplashScreenBackground">#1c1d21</item>\n<item name="windowSplashScreenAnimatedIcon">@drawable/splash_logo</item>|' $S

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mp3-dop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app.apk
          gh release create "apk-${{ github.run_number }}" app.apk --title "APK build ${{ github.run_number }}" --notes "Built with Multi Bundle" --target "$GITHUB_SHA"